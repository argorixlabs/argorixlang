name: Core C execution

# ESP-008.R: execute Argorix Core runtime cases through the transitional C
# backend and inspect the executables for Rust dependencies. The harness is
# the `core-c-harness` binary of crates/argorix_core_c. See
# conformance/core_c/README.md.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: core-c-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  harness-unit:
    name: Harness unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Unit tests (no C compiler needed)
        run: cargo test -p argorix-core-c --locked

  emit:
    name: Emit Core C bundle
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.detect.outputs.available }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build argorixc and the harness
        run: cargo build --locked -p argorixc -p argorix-core-c
      - name: Detect ESP-008 emitter and runtime cases
        id: detect
        # Execution is skipped only while BOTH the emitter and the case manifest
        # are absent (main before ESP-008 landed). One without the other fails.
        run: |
          cases=tests/selfhost/runtime/cases.json
          if ./target/debug/argorixc --help | grep -q 'core-emit-c'; then emitter=yes; else emitter=no; fi
          if [ -f "$cases" ]; then present=yes; else present=no; fi
          echo "emitter=$emitter cases=$present"
          if [ "$emitter" = yes ] && [ "$present" = yes ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif [ "$emitter" = no ] && [ "$present" = no ]; then
            echo "::notice title=Core C execution not run::This revision has neither 'argorixc core-emit-c' nor $cases. No execution evidence was produced."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Inconsistent ESP-008 state: emitter=$emitter, cases=$present"
            exit 1
          fi
      - name: Emit C for every case
        if: steps.detect.outputs.available == 'true'
        run: ./target/debug/core-c-harness emit --argorixc target/debug/argorixc --bundle target/core-c/bundle
      - name: Stage the harness with the bundle
        if: steps.detect.outputs.available == 'true'
        # The Rust-free job needs the harness binary; that host has no Rust
        # toolchain to build it, which is the point of the exercise.
        run: cp target/debug/core-c-harness target/core-c/bundle/
      - uses: actions/upload-artifact@v7
        if: steps.detect.outputs.available == 'true'
        with:
          name: core-c-bundle
          path: target/core-c/bundle/
          if-no-files-found: error

  execute:
    name: Execute (${{ matrix.compiler }})
    needs: emit
    if: needs.emit.outputs.available == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: core-c-bundle
          path: target/core-c/bundle
      - name: Compile, execute and inspect
        run: |
          chmod +x target/core-c/bundle/core-c-harness
          ./target/core-c/bundle/core-c-harness run \
            --bundle target/core-c/bundle \
            --cc ${{ matrix.compiler }} \
            --report target/core-c/report-${{ matrix.compiler }}.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: core-c-report-${{ matrix.compiler }}
          path: target/core-c/report-${{ matrix.compiler }}.json
          if-no-files-found: ignore

  execute-rust-free:
    name: Execute on a host without Rust
    needs: emit
    if: needs.emit.outputs.available == 'true'
    runs-on: ubuntu-latest
    # GitHub's ubuntu images ship rustup; a clean container does not. The
    # harness reads ELF itself, so only a C compiler is installed here.
    container: debian:stable-slim
    steps:
      - name: Install the C toolchain only
        run: |
          apt-get update
          apt-get install -y --no-install-recommends gcc libc6-dev git ca-certificates
      - uses: actions/checkout@v7
      - name: Trust the workspace for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/download-artifact@v8
        with:
          name: core-c-bundle
          path: target/core-c/bundle
      - name: Compile, execute and inspect (fails if rustc/cargo/rustup exist)
        run: |
          chmod +x target/core-c/bundle/core-c-harness
          ./target/core-c/bundle/core-c-harness run \
            --bundle target/core-c/bundle \
            --cc gcc \
            --require-rust-free-host \
            --report target/core-c/report-rust-free.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: core-c-report-rust-free
          path: target/core-c/report-rust-free.json
          if-no-files-found: ignore

  gap-corpus:
    name: Known-gap corpus (issue #27)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build argorixc and the harness
        run: cargo build --locked -p argorixc -p argorix-core-c
      - name: Check recorded gaps
        # Fails only when a gap behaves differently from its record. A gap that
        # starts passing is reported as a notice, for promotion into cases.json.
        run: >-
          ./target/debug/core-c-harness gaps
          --argorixc target/debug/argorixc
          --cc gcc
          --github-annotations
          --report target/core-c/gaps-report.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: core-c-gaps-report
          path: target/core-c/gaps-report.json
          if-no-files-found: ignore

  differential:
    name: Differential against the spec oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build argorixc and the harness
        run: cargo build --locked -p argorixc -p argorix-core-c
      - name: Generate programs and compare against the oracle
        run: |
          set -eu
          for seed in 1 2 3; do
            ./target/debug/core-c-harness generate --seed "$seed" --count 60 \
              --out "target/core-c/fuzz-$seed"
            ./target/debug/core-c-harness all \
              --argorixc target/debug/argorixc --cc gcc \
              --cases "target/core-c/fuzz-$seed/cases.json" \
              --bundle "target/core-c/fuzz-bundle-$seed" \
              --work-dir "target/core-c/fuzz-work-$seed" \
              --report "target/core-c/fuzz-report-$seed.json"
          done
      - uses: actions/upload-artifact@v7
        # The generated programs go with the report so any failure can be
        # reproduced exactly from the artifact.
        if: always()
        with:
          name: core-c-differential
          path: |
            target/core-c/fuzz-*/
            target/core-c/fuzz-report-*.json
          if-no-files-found: ignore

  execute-older-gcc:
    name: Execute with GCC 12
    runs-on: ubuntu-latest
    # The declared toolchain profile is C11 with -Wall -Wextra -Werror and no
    # compiler version floor, but the runner and the Rust-free container both
    # carry a recent GCC. This job pins an older one: GCC 12 rejected the
    # unsigned add check that GCC 13+ accepted. The image ships cargo too, so
    # argorixc and the harness are built here rather than carried in.
    container: rust:1-slim-bookworm
    steps:
      - name: Install git for checkout
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@v7
      - name: Trust the workspace for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build argorixc and the harness
        run: cargo build --locked -p argorixc -p argorix-core-c
      - name: Emit, execute and inspect with GCC 12
        run: >-
          ./target/debug/core-c-harness all
          --argorixc target/debug/argorixc
          --cc gcc
          --bundle target/core-c/bundle-gcc12
          --work-dir target/core-c/gcc12
          --report target/core-c/report-gcc12.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: core-c-report-gcc12
          path: target/core-c/report-gcc12.json
          if-no-files-found: ignore
