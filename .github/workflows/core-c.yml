name: Core C execution

# ESP-008.R: execute Argorix Core runtime cases through the transitional C
# backend and inspect the executables for Rust dependencies. The harness is
# the `core-c-harness` binary of crates/argorix_core_c. See
# conformance/core_c/README.md.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: core-c-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  harness-unit:
    name: Harness unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Unit tests (no C compiler needed)
        run: cargo test -p argorix-core-c --locked

  emit:
    name: Emit Core C bundle
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.detect.outputs.available }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build argorixc and the harness
        run: cargo build --locked -p argorixc -p argorix-core-c
      - name: Detect ESP-008 emitter and runtime cases
        id: detect
        # Execution is skipped only while BOTH the emitter and the case manifest
        # are absent (main before ESP-008 landed). One without the other fails.
        run: |
          cases=tests/selfhost/runtime/cases.json
          if ./target/debug/argorixc --help | grep -q 'core-emit-c'; then emitter=yes; else emitter=no; fi
          if [ -f "$cases" ]; then present=yes; else present=no; fi
          echo "emitter=$emitter cases=$present"
          if [ "$emitter" = yes ] && [ "$present" = yes ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif [ "$emitter" = no ] && [ "$present" = no ]; then
            echo "::notice title=Core C execution not run::This revision has neither 'argorixc core-emit-c' nor $cases. No execution evidence was produced."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Inconsistent ESP-008 state: emitter=$emitter, cases=$present"
            exit 1
          fi
      - name: Emit C for every case
        if: steps.detect.outputs.available == 'true'
        run: ./target/debug/core-c-harness emit --argorixc target/debug/argorixc --bundle target/core-c/bundle
      - name: Stage the harness with the bundle
        if: steps.detect.outputs.available == 'true'
        # The Rust-free job needs the harness binary; that host has no Rust
        # toolchain to build it, which is the point of the exercise.
        run: cp target/debug/core-c-harness target/core-c/bundle/
      - uses: actions/upload-artifact@v7
        if: steps.detect.outputs.available == 'true'
        with:
          name: core-c-bundle
          path: target/core-c/bundle/
          if-no-files-found: error

  execute:
    name: Execute (${{ matrix.compiler }})
    needs: emit
    if: needs.emit.outputs.available == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: core-c-bundle
          path: target/core-c/bundle
      - name: Compile, execute and inspect
        # --repeat 3 is the determinism requirement of spec/core/stdlib.md:
        # "Repeated execution with gcc and clang must produce byte-identical
        # output." Both compilers run here, and each binary three times.
        run: |
          chmod +x target/core-c/bundle/core-c-harness
          ./target/core-c/bundle/core-c-harness run \
            --bundle target/core-c/bundle \
            --cc ${{ matrix.compiler }} \
            --repeat 3 \
            --report target/core-c/report-${{ matrix.compiler }}.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: core-c-report-${{ matrix.compiler }}
          path: target/core-c/report-${{ matrix.compiler }}.json
          if-no-files-found: ignore

  execute-rust-free:
    name: Execute on a host without Rust
    needs: emit
    if: needs.emit.outputs.available == 'true'
    runs-on: ubuntu-latest
    # GitHub's ubuntu images ship rustup; a clean container does not. The
    # harness reads ELF itself, so only a C compiler is installed here.
    container: debian:stable-slim
    steps:
      - name: Install the C toolchain only
        run: |
          apt-get update
          apt-get install -y --no-install-recommends gcc libc6-dev git ca-certificates
      - uses: actions/checkout@v7
      - name: Trust the workspace for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/download-artifact@v8
        with:
          name: core-c-bundle
          path: target/core-c/bundle
      - name: Compile, execute and inspect (fails if rustc/cargo/rustup exist)
        run: |
          chmod +x target/core-c/bundle/core-c-harness
          ./target/core-c/bundle/core-c-harness run \
            --bundle target/core-c/bundle \
            --cc gcc \
            --require-rust-free-host \
            --report target/core-c/report-rust-free.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: core-c-report-rust-free
          path: target/core-c/report-rust-free.json
          if-no-files-found: ignore

  gap-corpus:
    name: Known-gap corpus (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # A gap can belong to one compiler alone: g23 is a -Wself-assign
        # error that GCC does not implement, and the harness skips a gap
        # recorded for a compiler it is not running.
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build argorixc and the harness
        run: cargo build --locked -p argorixc -p argorix-core-c
      - name: Check recorded gaps
        # Fails only when a gap behaves differently from its record. A gap that
        # starts passing is reported as a notice, for promotion into cases.json.
        run: >-
          ./target/debug/core-c-harness gaps
          --argorixc target/debug/argorixc
          --cc ${{ matrix.compiler }}
          --github-annotations
          --report target/core-c/gaps-report-${{ matrix.compiler }}.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: core-c-gaps-report-${{ matrix.compiler }}
          path: target/core-c/gaps-report-${{ matrix.compiler }}.json
          if-no-files-found: ignore

  differential:
    name: Differential against the spec oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build argorixc and the harness
        run: cargo build --locked -p argorixc -p argorix-core-c
      - name: Generate programs and compare against the oracle
        run: |
          set -eu
          for seed in 1 2 3 4; do
            ./target/debug/core-c-harness generate --seed "$seed" --count 80 \
              --out "target/core-c/fuzz-$seed"
            ./target/debug/core-c-harness all \
              --argorixc target/debug/argorixc --cc gcc \
              --cases "target/core-c/fuzz-$seed/cases.json" \
              --bundle "target/core-c/fuzz-bundle-$seed" \
              --work-dir "target/core-c/fuzz-work-$seed" \
              --report "target/core-c/fuzz-report-$seed.json"
          done
      - name: Compare one seed with clang
        # The declared -Werror profile is not the same on both
        # compilers: a self-assignment is an error for clang and
        # invisible to GCC (gap g23), and that showed up first in a
        # generated program, not in a fixture.
        run: |
          set -eu
          ./target/debug/core-c-harness generate --seed 6 --count 80 \
            --out target/core-c/fuzz-6
          ./target/debug/core-c-harness all \
            --argorixc target/debug/argorixc --cc clang \
            --cases target/core-c/fuzz-6/cases.json \
            --bundle target/core-c/fuzz-bundle-6 \
            --work-dir target/core-c/fuzz-work-6 \
            --report target/core-c/fuzz-report-6.json
      - name: Run one seed under the sanitizers
        # A generated corpus is where a leak in a construct shows up
        # first: the Buffer storage that was never released was found
        # that way, and the constructs ESP-009.C added reach the same
        # allocator and the same handle registry.
        run: |
          set -eu
          ./target/debug/core-c-harness generate --seed 5 --count 80 \
            --out target/core-c/fuzz-5
          ./target/debug/core-c-harness all \
            --argorixc target/debug/argorixc --cc gcc --sanitize \
            --cases target/core-c/fuzz-5/cases.json \
            --bundle target/core-c/fuzz-bundle-5 \
            --work-dir target/core-c/fuzz-work-5 \
            --report target/core-c/fuzz-report-5.json
      - uses: actions/upload-artifact@v7
        # The generated programs go with the report so any failure can be
        # reproduced exactly from the artifact.
        if: always()
        with:
          name: core-c-differential
          path: |
            target/core-c/fuzz-*/
            target/core-c/fuzz-report-*.json
          if-no-files-found: ignore

  execute-older-gcc:
    name: Execute with GCC 12
    runs-on: ubuntu-latest
    # The declared toolchain profile is C11 with -Wall -Wextra -Werror and no
    # compiler version floor, but the runner and the Rust-free container both
    # carry a recent GCC. This job pins an older one: GCC 12 rejected the
    # unsigned add check that GCC 13+ accepted. The image ships cargo too, so
    # argorixc and the harness are built here rather than carried in.
    container: rust:1-slim-bookworm
    steps:
      - name: Install git for checkout
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@v7
      - name: Trust the workspace for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build argorixc and the harness
        run: cargo build --locked -p argorixc -p argorix-core-c
      - name: Emit, execute and inspect with GCC 12
        run: >-
          ./target/debug/core-c-harness all
          --argorixc target/debug/argorixc
          --cc gcc
          --bundle target/core-c/bundle-gcc12
          --work-dir target/core-c/gcc12
          --report target/core-c/report-gcc12.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: core-c-report-gcc12
          path: target/core-c/report-gcc12.json
          if-no-files-found: ignore

  sanitizers:
    name: Sanitized execution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build argorixc and the harness
        run: cargo build --locked -p argorixc -p argorix-core-c
      - name: Run every case under AddressSanitizer and UBSan
        # Catches leaks and undefined behaviour that a plain run cannot see,
        # such as the Buffer storage that was never released.
        run: >-
          ./target/debug/core-c-harness all
          --argorixc target/debug/argorixc
          --cc gcc
          --sanitize
          --bundle target/core-c/bundle-sanitized
          --work-dir target/core-c/sanitized
          --report target/core-c/report-sanitized.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: core-c-report-sanitized
          path: target/core-c/report-sanitized.json
          if-no-files-found: ignore

  regression:
    name: Backend regression corpus (ESP-009.B)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build argorixc and the harness
        run: cargo build --locked -p argorixc -p argorix-core-c
      - name: Run the programs the backend once got wrong
        run: >-
          ./target/debug/core-c-harness all
          --argorixc target/debug/argorixc
          --cc gcc
          --cases conformance/core_c/regression/cases.json
          --bundle target/core-c/regression-bundle
          --work-dir target/core-c/regression
          --report target/core-c/report-regression.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: core-c-report-regression
          path: target/core-c/report-regression.json
          if-no-files-found: ignore

  stdlib:
    name: Standard library fixtures (ESP-009)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - cc: gcc
            flags: ""
          - cc: clang
            flags: ""
          - cc: gcc
            flags: --sanitize
          - cc: clang
            flags: --sanitize
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build argorixc and the harness
        run: cargo build --locked -p argorixc -p argorix-core-c
      - name: Run the stdlib fixtures
        # The harness passes --stdlib stdlib to argorixc, so each fixture links
        # the modules it imports from stdlib/.
        run: >-
          ./target/debug/core-c-harness all
          --argorixc target/debug/argorixc
          --cc ${{ matrix.cc }} ${{ matrix.flags }}
          --repeat 3
          --cases tests/selfhost/stdlib/cases.json
          --bundle target/core-c/stdlib-bundle
          --work-dir target/core-c/stdlib
          --report target/core-c/report-stdlib.json
      - name: Run the lexer fixtures (ESP-010)
        # And --modules compiler, so they reach the Argorix lexer in compiler/.
        run: >-
          ./target/debug/core-c-harness all
          --argorixc target/debug/argorixc
          --cc ${{ matrix.cc }} ${{ matrix.flags }}
          --cases tests/selfhost/lexer/cases.json
          --bundle target/core-c/lexer-bundle
          --work-dir target/core-c/lexer
          --report target/core-c/report-lexer.json
      - name: Run the parser fixtures (ESP-011)
        run: >-
          ./target/debug/core-c-harness all
          --argorixc target/debug/argorixc
          --cc ${{ matrix.cc }} ${{ matrix.flags }}
          --cases tests/selfhost/parser/cases.json
          --bundle target/core-c/parser-bundle
          --work-dir target/core-c/parser
          --report target/core-c/report-parser.json
      - name: Run the checker fixtures (ESP-012)
        run: >-
          ./target/debug/core-c-harness all
          --argorixc target/debug/argorixc
          --cc ${{ matrix.cc }} ${{ matrix.flags }}
          --cases tests/selfhost/check/cases.json
          --bundle target/core-c/check-bundle
          --work-dir target/core-c/check
          --report target/core-c/report-check.json
      - name: Run the agent-language lexer and parser fixtures (ESP-018)
        run: >-
          ./target/debug/core-c-harness all
          --argorixc target/debug/argorixc
          --cc ${{ matrix.cc }} ${{ matrix.flags }}
          --cases tests/selfhost/agent/cases.json
          --bundle target/core-c/agent-bundle
          --work-dir target/core-c/agent
          --report target/core-c/report-agent.json
      - name: Run the IR fixtures (ESP-013)
        run: >-
          ./target/debug/core-c-harness all
          --argorixc target/debug/argorixc
          --cc ${{ matrix.cc }} ${{ matrix.flags }}
          --cases tests/selfhost/ir/cases.json
          --bundle target/core-c/ir-bundle
          --work-dir target/core-c/ir
          --report target/core-c/report-ir.json
      - name: Run the C backend fixtures (ESP-013)
        run: >-
          ./target/debug/core-c-harness all
          --argorixc target/debug/argorixc
          --cc ${{ matrix.cc }} ${{ matrix.flags }}
          --cases tests/selfhost/c/cases.json
          --bundle target/core-c/c-bundle
          --work-dir target/core-c/c
          --report target/core-c/report-c.json
      - name: Run the pipeline fixtures (ESP-013)
        run: >-
          ./target/debug/core-c-harness all
          --argorixc target/debug/argorixc
          --cc ${{ matrix.cc }} ${{ matrix.flags }}
          --cases tests/selfhost/pipeline/cases.json
          --bundle target/core-c/pipeline-bundle
          --work-dir target/core-c/pipeline
          --report target/core-c/report-pipeline.json
      - name: Run the stage1 fixtures (ESP-014)
        run: >-
          ./target/debug/core-c-harness all
          --argorixc target/debug/argorixc
          --cc ${{ matrix.cc }} ${{ matrix.flags }}
          --cases tests/selfhost/stage1/cases.json
          --bundle target/core-c/stage1-bundle
          --work-dir target/core-c/stage1
          --report target/core-c/report-stage1.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: core-c-report-stdlib-${{ matrix.cc }}${{ matrix.flags && '-sanitized' || '' }}
          path: target/core-c/report-stdlib.json
          if-no-files-found: ignore

  stage1-emit:
    name: Emit stage1 with stage0 (ESP-014)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build stage0
        run: cargo build --locked -p argorixc
      - name: Stage0 writes the C of stage1
        run: python3 bootstrap/stage1.py emit --argorixc target/debug/argorixc --out target/stage1
      - uses: actions/upload-artifact@v7
        with:
          name: stage1-c
          path: |
            target/stage1/stage1.c
            target/stage1/stage0.json
          if-no-files-found: error

  stage1:
    name: Stage1 builds itself without Rust (${{ matrix.cc }})
    needs: stage1-emit
    runs-on: ubuntu-latest
    # A clean container: no Rust toolchain, only a C compiler and Python for
    # the script. Stage1 is compiled and run on its own sources here.
    container: debian:stable-slim
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - name: Install a C toolchain and Python only
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ${{ matrix.cc }} libc6-dev python3 git ca-certificates
      - uses: actions/checkout@v7
      - name: Trust the workspace for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/download-artifact@v8
        with:
          name: stage1-c
          path: target/stage1
      - name: Build stage1 and let it compile itself (fails if rustc, cargo or rustup exist)
        run: python3 bootstrap/stage1.py build --cc ${{ matrix.cc }} --out target/stage1 --require-rust-free-host
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stage1-provenance-${{ matrix.cc }}
          path: |
            target/stage1/stage1-provenance.json
            target/stage1/self/compiler.json
          if-no-files-found: ignore

  selfhost:
    name: Stage2 and stage3 without Rust or network (ESP-015, ${{ matrix.cc }})
    needs: stage1-emit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: stage1-c
          path: target/stage1
      - name: Build the bootstrap environment (a C compiler and Python only)
        # BuildKit keeps a base image out of the local store, so the base is
        # pulled first, its digest recorded, and the image built from that
        # digest.
        run: |
          docker pull debian:stable-slim
          base="$(docker image inspect debian:stable-slim --format '{{index .RepoDigests 0}}')"
          mkdir -p target/selfhost
          docker image inspect debian:stable-slim --format '{{json .RepoDigests}}' > target/selfhost/base-image.json
          cat target/selfhost/base-image.json
          docker build --build-arg BASE_IMAGE="$base" --build-arg CC_PACKAGE=${{ matrix.cc }} -t argorix-selfhost bootstrap/container
      - name: stage1 builds stage2, stage2 builds stage3, with no network
        run: >-
          docker run --rm --network none --user "$(id -u):$(id -g)"
          -v "$PWD:/w" -w /w argorix-selfhost
          python3 bootstrap/selfhost.py --from target/stage1 --cc ${{ matrix.cc }}
          --out target/selfhost --require-rust-free-host --require-no-network
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: selfhost-report-${{ matrix.cc }}
          path: |
            target/selfhost/selfhost-report.json
            target/selfhost/base-image.json
          if-no-files-found: ignore

  native-seed:
    name: Native seed and runtime shim (ESP-016)
    needs: stage1-emit
    runs-on: ubuntu-latest
    # The last step that uses a C compiler: it builds the runtime shim once,
    # builds stage1 from stage0's C, and lets stage1 write the seed object.
    container: debian:stable-slim
    steps:
      - name: Install a C toolchain and Python only
        run: |
          apt-get update
          apt-get install -y --no-install-recommends gcc binutils libc6-dev python3 git ca-certificates
      - uses: actions/checkout@v7
      - name: Trust the workspace for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/download-artifact@v8
        with:
          name: stage1-c
          path: target/stage1
      - name: Build the shim and stage1, and write the seed object
        run: python3 bootstrap/native.py seed --from target/stage1 --cc gcc --out target/native
      - uses: actions/upload-artifact@v7
        with:
          name: native-seed
          path: |
            target/native/seed.json
            target/native/stage1.c
            target/native/stage0.json
            target/native/shim/*.o
            target/native/shim/shim.json
            target/native/seed/build/compiler.o
            target/native/seed/build/compiler.json
            target/native/seed/build/diagnostics.txt
          if-no-files-found: error

  native:
    name: Native bootstrap without a C compiler, Rust or network (ESP-016)
    needs: native-seed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: native-seed
          path: target/native
      - name: Build the bootstrap environment (the linker, the C library and Python only)
        run: |
          docker pull debian:stable-slim
          base="$(docker image inspect debian:stable-slim --format '{{index .RepoDigests 0}}')"
          docker image inspect debian:stable-slim --format '{{json .RepoDigests}}' > target/native/base-image.json
          cat target/native/base-image.json
          docker build --build-arg BASE_IMAGE="$base" -t argorix-native bootstrap/container/native
      - name: The native compiler builds itself, compiles the suites and propagates edits, with no network
        run: >-
          docker run --rm --network none --user "$(id -u):$(id -g)"
          -v "$PWD:/w" -w /w argorix-native
          python3 bootstrap/native.py bootstrap --out target/native
          --require-no-c-compiler --require-rust-free-host --require-no-network
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-report
          path: |
            target/native/native-report.json
            target/native/base-image.json
            target/native/seed.json
            target/native/native3/argorixc
            target/native/native3/build/compiler.o
            target/native/native3/build/compiler.json
          if-no-files-found: ignore

  native-oracle:
    name: Native backend against the spec oracle (ESP-016)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build argorixc and the harness
        run: cargo build --locked -p argorixc -p argorix-core-c
      - name: Stage0 writes stage1; stage1 and the shim are built
        run: |
          python3 bootstrap/stage1.py emit --argorixc target/debug/argorixc --out target/stage1
          python3 bootstrap/native.py seed --from target/stage1 --cc gcc --out target/native
      - name: Generated programs, compiled natively, against the oracle
        # The generator writes each program with the result or trap the
        # spec oracle gives it; stage1 compiles it to a native object.
        run: |
          set -eu
          for seed in 1 2 3 4 5 6; do
            ./target/debug/core-c-harness generate --seed "$seed" --count 80 \
              --out "target/core-c/native-fuzz-$seed"
          done
          python3 bootstrap/native.py cases --out target/native target/core-c/native-fuzz-*/cases.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-oracle
          path: target/core-c/native-fuzz-*/
          if-no-files-found: ignore
